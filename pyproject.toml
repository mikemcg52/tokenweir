[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenweir"
version = "0.0.0"
description = "Provider-neutral, transport-agnostic usage & cost metering (extracted from the AI Gateway per ADR-0001)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Mike McGonagle" }]
keywords = ["usage", "metering", "cost", "observability", "llm"]
# Core stays dependency-light by contract (ADR-0001 Pillar 2): no transport libs here.
dependencies = []

# The subscription capture adapter's entry point (TOKWEIR-7). Claude Code's
# `settings.json` names a command, so the hook has to *be* one — and a console
# script is the only form that stays correct across a venv, a pipx install and a
# wheel, where a hard-coded path to a checkout does not. `python -m
# tokenweir.claude_code` is the same entry point for anyone who prefers it.
[project.scripts]
tokenweir-claude-code-hook = "tokenweir.claude_code:main"

[project.optional-dependencies]
# Transport adapters ship as optional extras so the core never compiles in pika.
amqp = ["pika>=1.3"]
# Likewise the store: `tokenweir.postgres` and `tokenweir.migrations` import no
# driver at module level, so the core installs and imports without this.
postgres = ["psycopg[binary]>=3"]
# `jsonschema` is test-only: it validates payloads against the published schema.
# It must never become a runtime dependency — the core stays dependency-light.
# `psycopg` is here so a developer with a Postgres can run the real-store tests;
# without it (and without TOKENWEIR_TEST_DSN) those tests skip.
# `pglast` wraps libpg_query, the server's own parser, so the migrations can be
# syntax-checked with no server running. Test-only and skipped when absent — a
# compiled parser is too heavy to require of someone who only imports the
# contract, and it never becomes a runtime dependency.
# `pgserver` ships the PostgreSQL binaries in its wheel, so `tests/conftest.py`
# can start a throwaway server with no root, no apt and no Docker when
# TOKENWEIR_TEST_DSN is unset. It is here and nowhere else on purpose: the
# real-Postgres suite must still skip for someone who installs only the core.
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "jsonschema>=4",
    "psycopg[binary]>=3",
    "pglast>=6",
    # `pika` is here so FR-022's claim — persistent, JSON-content-type messages —
    # can be checked against the real `pika.BasicProperties` rather than only
    # against the test double that stands in for it. Test-only and skipped when
    # absent, exactly like the others: it must never become a runtime dependency,
    # and the AMQP adapter is an optional extra precisely so a core install
    # carries no transport library.
    "pika>=1.3",
    "pgserver>=0.1.4; sys_platform != 'win32'",
    # `build` lets the suite build a wheel and look inside it, which is the only
    # way to check that the migrations really reach an install (SC-001) rather
    # than that the declaration saying they should is still there.
    "build>=1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["tokenweir*"]

# The migrations are package data, not repository artifacts: tokenweir owns the
# schema (ADR-0001 Pillar 5) and has to be able to *apply* it from a wheel
# install. This is deliberately the opposite treatment from
# `schema/usage-record.v1.json`, which a consumer reads for itself and which the
# README documents as repo-only.
[tool.setuptools.package-data]
"tokenweir.migrations" = ["sql/*.sql"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
